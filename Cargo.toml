[package]
name = "systemctl-bot"
version = "0.4.2"
description = "Control your Linux server from Discord"
edition = "2021"
publish = false

[dependencies]
futures = "0.3"
mockall = "0.15"
tokio-stream = "0.1"

[dependencies.clap]
version = "4.0"
features = ["derive"]

[dependencies.config]
version = "0.13"
default-features = false
features = ["toml"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["cache", "client", "gateway", "model", "rustls_backend"]

[dependencies.tokio]
version = "1.18"
features = ["rt-multi-thread"]

[dependencies.zbus_systemd]
version = "0.26201"
features = ["systemd1"]

[dev-dependencies]
async-stream = "0.3"

[lints.clippy]
pedantic = "warn"
